name: Lint Code

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint_python:
    name: Lint Python Files
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Flake8
        run: python -m pip install flake8

      - name: Run Python Linter
        run: |
          python -m flake8 server --exclude=djangoenv,node_modules,build,__pycache__
          echo "Linted all the python files successfully"

  lint_js:
    name: Lint JavaScript Files
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install JSHint
        run: npm install --global jshint

      - name: Run JavaScript Linter
        run: |
          find server/database -name "*.js" -not -path "*/node_modules/*" -print0 |
            xargs -0 --no-run-if-empty jshint --config .jshintrc
          echo "Linted all the js files successfully"
